name: Lighthouse accessibility

on:
  push:
    tags:
      - 'v*'

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Serve `dist/` and wait
        run: |
          npx http-server ./dist -p 8080 --silent &
          for i in {1..15}; do
            if curl -sSf http://127.0.0.1:8080 >/dev/null; then
              echo "server up"; break
            fi
            echo "waiting for server... ($i)"; sleep 1
          done
      - name: Run Lighthouse (accessibility)
        run: |
          npx -y lighthouse "http://127.0.0.1:8080" --only-categories=accessibility --output=json --output-path=lh-report-ci.json --chrome-flags="--no-sandbox --headless"
      - name: Upload Lighthouse report
        uses: actions/upload-artifact@v4
        with:
          name: lh-report-ci
          path: lh-report-ci.json
