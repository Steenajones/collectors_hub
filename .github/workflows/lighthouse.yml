name: Lighthouse accessibility

on:
  push:
    tags:
      - 'v*'

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Serve `dist/` and wait
        run: |
          npx http-server ./dist -p 8080 --silent &
          for i in {1..15}; do
            if curl -sSf http://127.0.0.1:8080 >/dev/null; then
              echo "server up"; break
            fi
            echo "waiting for server... ($i)"; sleep 1
          done
      - name: Debug environment
        run: |
          echo "Node version:"; node -v || true
          echo "NPM version:"; npm -v || true
          echo "Which chromium:"; which chromium || which chromium-browser || which google-chrome || true
          ls -la /usr/bin | sed -n '1,200p' || true
          df -h || true
      - name: Run Lighthouse (accessibility)
        run: |
          set -x
          sudo apt-get update
          sudo apt-get install -y chromium-browser chromium curl jq || true
          CHROME_PATH=$(which chromium || which chromium-browser || which google-chrome || true)
          echo "Using chrome: $CHROME_PATH"
          # Run Lighthouse and capture output to a log file. If Lighthouse fails, print a short message
          # but continue so we can always upload logs for debugging.
          npx -y lighthouse "http://127.0.0.1:8080" \
            --only-categories=accessibility \
            --output=json \
            --output-path=lh-report-ci.json \
            --chrome-flags="--no-sandbox --headless" ${CHROME_PATH:+--chrome-path=$CHROME_PATH} > lh-output.log 2>&1 || echo "lighthouse exited with non-zero status, continuing"
          echo "==== Lighthouse (tail) ===="
          tail -n 400 lh-output.log || true
      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lh-report-ci
          path: |
            lh-report-ci.json
            lh-output.log
            
